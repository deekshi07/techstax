name: GitHub Webhook Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r webhook-repo/requirements.txt

    - name: Syntax & Server Unit Test
      run: |
        python -m py_compile webhook-repo/app.py
        python -c "import flask, flask_cors, datetime; print('Techstax dependencies verified.')"
